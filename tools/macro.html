<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VESPER — macro probe (not shipped)</title>
<style>
  html,body{margin:0;height:100%;background:#0d0b0a;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
  .hud{position:fixed;left:12px;bottom:10px;font:10px monospace;color:#e8e0d4;letter-spacing:.1em;opacity:.7}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hud" id="hud">macro probe</div>
<script type="module">
import { createStage } from '../js/scene3d.js';
const q = new URLSearchParams(location.search);
const s = createStage(document.getElementById('stage'));
const atmo = q.get('atmo') || 'hearth';
const finish = q.get('finish') || 'slate';
const mood = parseFloat(q.get('mood') || '0.9');
const inten = parseFloat(q.get('i') || '0.75');
const dist = parseFloat(q.get('d') || '0.30');
s.setMood(mood); s.setIntensity(inten); s.setAtmosphere(atmo); s.setFinish(finish);
s.setPhase(-2.073); s.setOrbit(0);
s.paceCamera([0.0, 0.168, dist], [0.0, 0.162, 0], 24); s.snapCamera();
function fit(){ const c = document.getElementById('stage'); s.resize(c.clientWidth, c.clientHeight); }
fit(); addEventListener('resize', fit);
document.getElementById('hud').textContent = `${finish} · ${atmo} · mood ${mood} · i ${inten} · d ${dist}`;
let last = performance.now();
function loop(t){ const dt = Math.min(0.05, Math.max(0, (t - last) / 1000)); last = t; s.update(dt); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
window.__stage = s;
</script>
</body>
</html>
